*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;

  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ font-family:'Fraunces',Georgia,serif; font-weight:600; text-wrap:balance; margin:0; }
button{ font-family:inherit; }
a{ color:var(--accent); }
code{ font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace; background:var(--surface-alt); padding:1px 6px; border-radius:5px; font-size:0.85em; }
input,select,textarea{
  font-family:inherit; font-size:0.92rem; color:var(--text); background:var(--surface);
  border:1px solid var(--border); border-radius:8px; padding:8px 10px; width:100%;
}
input:focus,select:focus,textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
textarea{ resize:vertical; min-height:64px; }
label{ display:block; font-size:0.78rem; color:var(--text-muted); margin-bottom:4px; font-weight:500; }
.field{ margin-bottom:14px; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
@media (max-width:640px){ .form-grid{ grid-template-columns:1fr; } }
.btn{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); padding:9px 16px; border-radius:8px;
  font-size:0.88rem; font-weight:600; cursor:pointer;
}
.btn:hover{ border-color:var(--accent); }
.btn-primary{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }
.btn-primary:hover{ opacity:0.92; }
.btn-ghost{ background:transparent; border-color:transparent; color:var(--accent); padding:6px 8px; }
.btn-sm{ padding:5px 10px; font-size:0.78rem; }
.topbar{
  position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:14px 24px; background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand .mark{
  width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-contrast);
  display:flex; align-items:center; justify-content:center; font-family:'Fraunces',Georgia,serif;
  font-weight:700; font-size:0.92rem; letter-spacing:0.02em; flex-shrink:0;
}
.brand h1{ font-size:1.15rem; }
.brand .sub{ font-size:0.72rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; }
.topbar-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.actor{ text-align:right; font-size:0.82rem; }
.actor .name{ font-weight:600; }
.actor .role{ color:var(--text-muted); font-size:0.74rem; }
.sync-dot{ display:inline-flex; align-items:center; gap:6px; font-size:0.74rem; color:var(--text-muted); }
.sync-dot .d{ width:7px; height:7px; border-radius:50%; background:var(--neutral); }
.sync-dot.shared .d{ background:var(--success); }
.sync-dot.local .d{ background:var(--warning); }
.layout{ max-width:1080px; margin:0 auto; padding:26px 20px 60px; }
.hint-banner{
  background:var(--accent-soft); border:1px solid var(--border); border-radius:10px; padding:12px 16px;
  font-size:0.82rem; color:var(--text); margin-bottom:20px;
}
.stats-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
@media (max-width:640px){ .stats-row{ grid-template-columns:1fr; } }
.stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); }
.stat-card .num{ font-family:'Fraunces',serif; font-size:1.9rem; font-weight:600; font-variant-numeric:tabular-nums; }
.stat-card .lbl{ font-size:0.74rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); margin-top:2px; }
.stat-card.warn .num{ color:var(--danger); }
.priority-box{ background:var(--danger-soft); border:1px solid var(--danger); border-radius:10px; padding:14px 16px; margin-bottom:20px; }
.priority-box h3{ font-size:0.95rem; color:var(--danger); margin-bottom:8px; }
.priority-box ul{ margin:0; padding-left:18px; font-size:0.86rem; }
.priority-box li{ margin-bottom:4px; }
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px; }
.table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface); box-shadow:var(--shadow); margin-bottom:16px; }
table{ width:100%; border-collapse:collapse; font-size:0.88rem; }
th,td{ text-align:left; padding:11px 14px; border-bottom:1px solid var(--border); }
th{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-muted); background:var(--surface-alt); white-space:nowrap; }
tr:last-child td{ border-bottom:none; }
.row-click{ cursor:pointer; }
.row-click:hover{ background:var(--surface-alt); }
.pill{ display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:0.74rem; font-weight:600; white-space:nowrap; }
.pill-success{ background:var(--success-soft); color:var(--success); }
.pill-warning{ background:var(--warning-soft); color:var(--warning); }
.pill-danger{ background:var(--danger-soft); color:var(--danger); }
.pill-neutral{ background:var(--neutral-soft); color:var(--neutral); }
.contact-links{ display:flex; gap:12px; font-size:0.82rem; }
.contact-links a{ text-decoration:underline; text-underline-offset:2px; }
.card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; box-shadow:var(--shadow); }
.fiche-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:6px; flex-wrap:wrap; }
.fiche-header h2{ font-size:1.4rem; }
.fiche-header .meta{ color:var(--text-muted); font-size:0.86rem; margin-top:3px; }
.move-formation{ display:flex; gap:8px; align-items:center; max-width:380px; margin:10px 0 20px; }
.move-formation select{ flex:1; }
.tabs{ display:flex; gap:4px; margin-bottom:18px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
.tab-btn{ background:transparent; border:none; padding:10px 14px; font-size:0.86rem; font-weight:600; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tab-btn.active{ color:var(--accent); border-bottom-color:var(--accent); }

.formation-card h3{ font-size:1rem; margin-bottom:6px; }
.formation-card-meta{ font-size:0.82rem; color:var(--text-muted); }
.suivi-section-title{ font-size:1.02rem; margin:0 0 14px; }

.rating-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:9px 14px; background:var(--surface-alt); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.02em; color:var(--text-muted); font-weight:600; border-bottom:1px solid var(--border); border-radius:12px 12px 0 0; }
.rating-head span:last-child{ width:170px; flex-shrink:0; text-align:left; }
.rating-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 14px; border-bottom:1px solid var(--border); }

.msg .txt{ white-space:pre-wrap; font-size:0.9rem; }

.toast{

  opacity:0; pointer-events:none; transition:opacity 0.25s ease, transform 0.25s ease; box-shadow:var(--shadow); z-index:50; max-width:90vw;

.print-area{ display:none; }
.print-area h1{ font-size:1.3rem; margin-bottom:10px; color:#000; }
.print-area h2{ font-size:1.05rem; margin:18px 0 6px; color:#000; }

.print-area .p-label{ font-weight:600; font-size:0.85rem; color:#000; margin:6px 0 2px; }
.print-area p{ font-size:0.85rem; color:#111; white-space:pre-wrap; margin:0 0 8px; }
.print-area table{ width:100%; border-collapse:collapse; margin-bottom:12px; font-size:0.78rem; }
.print-area th,.print-area td{ border:1px solid #999; padding:5px 7px; text-align:left; vertical-align:top; color:#111; }
.print-area th{ background:#eee; }
@media print{
  body > *:not(.print-area){ display:none !important; }
  .print-area{ display:block !important; }
}
</style>

  function esc(s){
    return String(s===null||s===undefined?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function fmtDate(iso){
    if(!iso) return '—';
    var p = iso.split('-');
    if(p.length!==3) return esc(iso);
    return p[2]+'/'+p[1]+'/'+p[0];
  }
  function fmtDateTime(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return esc(iso);
    var dd = String(d.getDate()).padStart(2,'0');
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var hh = String(d.getHours()).padStart(2,'0');
    var mi = String(d.getMinutes()).padStart(2,'0');
    return dd+'/'+mm+'/'+d.getFullYear()+' à '+hh+':'+mi;
  }

  function riskClass(r){

      evaluations: row.evaluations || [], messages: row.messages || []
    };
  }
  function rowToCompte(row){
    return {
      id: row.id, pseudo: row.pseudo, email: row.email, role: row.role,
      nomAffiche: row.nom_affiche, nom: row.nom, prenom: row.prenom, telephone: row.telephone,

    };

  function loadData(){
    return Promise.all([
      sb.from('stagiaires').select('*'),
      sb.from('comptes').select('*')
    ]).then(function(results){
      var stagRes = results[0], compRes = results[1];
      if(stagRes.error || compRes.error){
        syncStatus = 'error';
        console.error('Chargement impossible', stagRes.error || compRes.error);
        return;
      }
      DATA.stagiaires = stagRes.data.map(rowToStagiaire);
      DATA.comptes = compRes.data.map(rowToCompte);
      syncStatus = 'shared';
    }).catch(function(err){ syncStatus = 'error'; console.error(err); });
  }

  function daysUntil(iso){
    if(!iso) return Infinity;
    var target = new Date(iso+'T00:00:00');
    var now = new Date(); now.setHours(0,0,0,0);
    return Math.round((target-now)/86400000);
  }

  function findCompteByEmail(email, role){
    email = (email||'').trim().toLowerCase();
    if(!email) return null;
    var list = DATA.comptes || [];
    for(var i=0;i<list.length;i++){ if(list[i].email && list[i].email.toLowerCase()===email && (!role || list[i].role===role)) return list[i]; }
    return null;
  }
  // Retrouve tous les stagiaires rattachés à un compte tuteur, par correspondance
  // sur l’adresse e-mail (rattachement automatique, aucun lien à saisir à la main).
  function tuteurStagiaires(compteId){
    var compte = findCompte(compteId);
    if(!compte || !compte.email) return [];
    var email = compte.email.toLowerCase();
    return DATA.stagiaires.filter(function(s){ return s.tuteurEmail && s.tuteurEmail.toLowerCase()===email; });
  }
  // Crée ou met à jour automatiquement les comptes tuteurs à partir des adresses
  // e-mail renseignées sur les fiches stagiaires : un tuteur qui encadre plusieurs
  // stagiaires n’a besoin que d’un seul identifiant, retrouvé par son e-mail.
  // Les comptes tuteur sont désormais créés/mis à jour/supprimés automatiquement
  // côté base de données (trigger sync_tuteur_comptes), à partir de l'adresse
  // e-mail du tuteur renseignée sur chaque fiche stagiaire.
  function updateCompte(id, mutator){
    var c = findCompte(id);
    if(!c) return;
    var clone = deepClone(c);
    mutator(clone);
    var idx = DATA.comptes.findIndex(function(x){ return x.id===id; });
    if(idx>=0) DATA.comptes[idx] = clone;
    render();
    sb.rpc('rpc_update_compte', { p_id: id, p_patch: {
      nom: clone.nom, prenom: clone.prenom, email: clone.email, telephone: clone.telephone, nomAffiche: clone.nomAffiche
    }}).then(function(res){
      if(res.error){ showToast('Enregistrement impossible : '+res.error.message); }
    });
  }

  // ---------- pseudos prenom.nom ----------
  function cleanNamePart(s){
    return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  }
  function pseudoFromName(prenom, nom){
    var p = cleanNamePart(prenom), n = cleanNamePart(nom);
    if(!p || !n) return '';
    return p+'.'+n;
  }
  function pseudoFromFullName(full){
    var parts = (full||'').trim().split(/\s+/);
    if(parts.length<2) return '';
    return pseudoFromName(parts[0], parts.slice(1).join(' '));
  }

      } else {
        blocks.push({type:'p', text:'Aucune tâche renseignée.'});

      blocks.push({type:'p', label:'Autres remarques :', text: d.remarquesStagiaire});

      blocks.push({type:'table', headers:['Critère','Note (0 à 4)'], colFractions:[0.78,0.22],
        rows: CRIT1.map(function(c){ return [c[1], d.criteres1[c[0]] || '—']; })});
      blocks.push({type:'h3', text:'Grille complémentaire'});
      blocks.push({type:'table', headers:['Critère','Note (0 à 4)'], colFractions:[0.78,0.22],
        rows: CRIT2.map(function(c){ return [c[1], d.criteres2[c[0]] || '—']; })});

  // -- aperçu imprimable (pas de téléchargement : la page reste partageable par lien) --
  function blocksToPrintHtml(title, blocks){
    var html = '<h1>'+esc(title)+'</h1>';
    blocks.forEach(function(b){
      if(b.type==='meta'){ html += '<div class="meta-line">'+esc(b.text)+'</div>'; }
      else if(b.type==='h2'){ html += '<h2>'+esc(b.text)+'</h2>'; }
      else if(b.type==='h3'){ html += '<h3>'+esc(b.text)+'</h3>'; }
      else if(b.type==='p'){
        if(b.label){ html += '<div class="p-label">'+esc(b.label)+'</div>'; }
        if(b.text!==undefined){ html += '<p>'+esc(b.text||'—')+'</p>'; }
      }
      else if(b.type==='table'){
        html += '<table><thead><tr>' + b.headers.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('') + '</tr></thead><tbody>' +
          b.rows.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>'; }).join('') +
        '</tbody></table>';
      }
    });
    return html;
  }

  function printSheet(filenameBase, blocks, title){
    var area = document.getElementById('print-area');
    if(!area) return;
    area.innerHTML = blocksToPrintHtml(title, blocks);
    var prevTitle = document.title;
    document.title = filenameBase;
    try{ window.print(); }catch(e){}
    document.title = prevTitle;
    showToast('Utilisez Ctrl+P (ou Cmd+P) puis « Enregistrer en PDF » si la fenêtre d’impression ne s’est pas ouverte automatiquement.');
  }

  // ---------- authentication (demo-level: credentials stored in plain text in this page) ----------
  function tryLogin(identifiant, password){
    identifiant = (identifiant||'').trim();
    if(!identifiant || !password) return Promise.resolve(null);
    return sb.rpc('rpc_login', { p_identifiant: identifiant, p_password: password }).then(function(res){
      if(res.error || !res.data || res.data.status==='invalid') return null;
      return res.data;
    }).catch(function(){ return null; });
  }
  function doLogin(){
    var idf = getVal('login-identifiant');
    var pwd = getVal('login-motdepasse');
    if(!idf || !pwd){ showToast('Merci de renseigner votre identifiant et votre mot de passe.'); return; }
    tryLogin(idf, pwd).then(function(result){
      if(!result){ showToast('Identifiant ou mot de passe incorrect.'); return; }
      if(result.status==='needs-setup'){
        view = { screen:'setup-password', role:result.role, profileId:result.profileId, selectedFormation:null, selectedId:null, tab:'infos', showAdd:false, detailPeriod:0 };
        saveView(); render(); return;
      }
      view = { screen:'app', role:result.role, profileId:result.profileId, selectedFormation:null, selectedId:null, tab:'infos', showAdd:false, detailPeriod:0 };
      saveView(); render();
    });
  }
  function findAccountByEmail(email){
    email = (email||'').trim();
    if(!email) return Promise.resolve(null);
    return sb.rpc('rpc_find_by_email', { p_email: email }).then(function(res){
      if(res.error || !res.data) return null;
      return res.data;
    }).catch(function(){ return null; });
  }
  function applyPasswordReset(target, newPass){
    return sb.rpc('rpc_set_password', { p_kind: target.kind, p_id: target.id, p_new_password: newPass }).then(function(res){
      return !res.error && res.data===true;
    }).catch(function(){ return false; });

  function applyOwnPasswordChange(kind, id, currentPass, newPass){
    return sb.rpc('rpc_set_password', { p_kind: kind, p_id: id, p_new_password: newPass, p_current_password: currentPass }).then(function(res){
      return !res.error && res.data===true;
    }).catch(function(){ return false; });
  }

  var STAGIAIRE_PATCH_FIELDS = ['prenom','nom','formation','telephone','email','structureNom','structureAdresse','tuteurNom','tuteurTelephone','tuteurEmail','identifiantStagiaire','planningStructure','planningDojo','documents','visites','suivis','evaluations','messages'];

  function updateStagiaire(id, mutator){
    var st = findStagiaire(id);
    if(!st) return;
    var clone = deepClone(st);
    mutator(clone);
    var idx = DATA.stagiaires.findIndex(function(x){ return x.id===id; });
    if(idx>=0) DATA.stagiaires[idx] = clone;
    saveView();
    render();
    var patch = {};
    STAGIAIRE_PATCH_FIELDS.forEach(function(k){ patch[k] = clone[k]; });
    sb.rpc('rpc_update_stagiaire', { p_id: id, p_patch: patch }).then(function(res){
      if(res.error){ showToast('Enregistrement impossible : '+res.error.message); }
    });
  }

    var t = document.getElementById('toast');

  function renderApp(){
    var isRef = isFullAccess();

      if(view.selectedId){
        var st = findStagiaire(view.selectedId);
        if(!st){ view.selectedId=null; main = renderFormationsHome(); }
        else { main = renderFiche(st); }
      } else if(view.selectedFormation){
        main = renderStagiairesList(view.selectedFormation);
      } else {
        main = renderFormationsHome();
      }
    } else if(view.role==='tuteur'){
      var tList = tuteurStagiaires(view.profileId);
      if(!tList.length){
        main = '<div class="empty-state">Aucun stagiaire ne vous est encore associé à cette adresse. Contactez votre référent Dojo Academy.</div>';
      } else {
        var activeId = view.selectedId && tList.some(function(s){ return s.id===view.selectedId; }) ? view.selectedId : tList[0].id;

  function globalStats(){
    var total = DATA.stagiaires.length;
    var eleve = 0, aVenir15 = 0;
    DATA.stagiaires.forEach(function(st){
      var lp = lastFilledPeriod(st);
      if(lp && lp.risque==='eleve') eleve++;
      if(lp && lp.prochaineVisite){
        var d = daysUntil(lp.prochaineVisite);
        if(d>=0 && d<=15) aVenir15++;
      }
    });
    return { total:total, eleve:eleve, aVenir15:aVenir15 };
  }

        '<td>'+fmtDate(next)+'</td>' +
        '<td><div class="contact-links"><a href="tel:'+esc(st.telephone)+'">Tél</a><a href="mailto:'+esc(st.email)+'">Mail</a></div></td>' +
      '</tr>';

    var addForm = '';
    if(view.showAdd){
      addForm = '<div class="card add-form"><h3 style="margin-bottom:14px;">Nouveau stagiaire — '+esc(formation)+'</h3>' + infosFormFields({
        prenom:'',nom:'',telephone:'',email:'',structureNom:'',structureAdresse:'',tuteurNom:'',tuteurTelephone:'',tuteurEmail:'',

      }, 'add-', true) +

  function mailtoInviteHtml(email, prenom, identifiant, motDePasse, roleLabel){
    if(!email || !identifiant || !motDePasse) return '';
    var subject = 'Vos identifiants de connexion — Suivi Alternance (Dojo Academy)';
    var body = 'Bonjour '+prenom+',\n\nVoici vos identifiants pour accéder à votre espace '+roleLabel+' sur Suivi Alternance :\n\nIdentifiant : '+identifiant+'\nMot de passe provisoire : '+motDePasse+'\n\nVous devrez choisir un nouveau mot de passe lors de votre première connexion.\n\nCordialement,\nDojo Academy';
    var href = 'mailto:'+email+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
    var mailtoBtn = '<a class="btn btn-sm" href="'+esc(href)+'" style="margin-top:8px;display:inline-flex;">✉️ Envoyer les identifiants par e-mail</a>';
    var copyBtn = '<button type="button" class="btn btn-sm" style="margin-top:8px;margin-left:8px;" data-action="copy-invite"' +
      ' data-invite-email="'+esc(email)+'" data-invite-prenom="'+esc(prenom)+'" data-invite-id="'+esc(identifiant)+'"' +
      ' data-invite-pwd="'+esc(motDePasse)+'" data-invite-role="'+esc(roleLabel)+'">📋 Copier le message</button>';
    return mailtoBtn + copyBtn +
      '<p class="hint-banner" style="margin-top:8px;">Si le bouton e-mail ne fonctionne pas (aucune messagerie configurée sur cet ordinateur), utilisez « Copier le message » puis collez-le dans un e-mail, un SMS ou une messagerie de votre choix.</p>';
  }

  function infosFormFields(v, prefix, isNew){
    function f(id,label,val,type){
      type = type||'text';
      return '<div class="field"><label for="'+prefix+id+'">'+label+'</label><input id="'+prefix+id+'" type="'+type+'" value="'+esc(val)+'" /></div>';
    }
    var accessSection = isNew
      ? ('<p class="hint-banner">Un mot de passe provisoire sera généré automatiquement à la création. Le/la stagiaire choisira lui/elle-même son mot de passe définitif dès sa première connexion.</p>' +
         '<div class="form-grid">' + f('identifiantStagiaire','Identifiant stagiaire (pseudo ou e-mail)',v.identifiantStagiaire) + '</div>')
      : ('<p class="hint-banner">Le pseudo de connexion est généré automatiquement au format prenom.nom si vous laissez le champ vide. Le mot de passe n’est jamais affiché ici pour des raisons de sécurité : laissez ce champ vide pour ne pas le modifier, ou saisissez-en un nouveau pour le réinitialiser (le/la stagiaire devra alors en choisir un nouveau à sa prochaine connexion).</p>' +
         '<div class="form-grid">' +
           f('identifiantStagiaire','Identifiant stagiaire (pseudo ou e-mail)',v.identifiantStagiaire) + f('motDePasseStagiaire','Réinitialiser le mot de passe (laisser vide sinon)',v.motDePasseStagiaire) +
         '</div>' +
         (v.motDePasseDefiniStagiaire===false ? '<p class="hint-banner">Le/la stagiaire ne s’est pas encore connecté(e) pour la première fois : le mot de passe ci-dessus est provisoire, il/elle en choisira un nouveau à sa première connexion.</p>' : '') +
         mailtoInviteHtml(v.email, v.prenom, v.identifiantStagiaire, v.motDePasseStagiaire, 'stagiaire'));
    return '<div class="form-grid">' +
      f('prenom','Prénom',v.prenom) + f('nom','Nom',v.nom) +
      f('telephone','Téléphone',v.telephone) + f('email','E-mail',v.email,'email') +
      f('structureNom','Structure d’accueil',v.structureNom) + f('structureAdresse','Adresse de la structure',v.structureAdresse) +
      f('tuteurNom','Nom du tuteur',v.tuteurNom) + f('tuteurTelephone','Téléphone tuteur',v.tuteurTelephone) +
      f('tuteurEmail','E-mail tuteur',v.tuteurEmail,'email') +
    '</div>' +
    '<h4 style="font-size:0.9rem;margin:18px 0 10px;">Accès stagiaire</h4>' +
    accessSection +
    '<h4 style="font-size:0.9rem;margin:18px 0 10px;">Accès tuteur</h4>' +
    tuteurAccessHint(v);
  }

  function tuteurAccessHint(v){
    var email = (v.tuteurEmail||'').trim();
    if(!email){
      return '<p class="hint-banner">Renseignez l’adresse e-mail du tuteur ci-dessus pour lui donner accès à son espace : il se connectera avec cette adresse (ou son identifiant prenom.nom généré automatiquement). S’il encadre déjà un autre stagiaire suivi ici avec la même adresse, ce stagiaire apparaîtra automatiquement dans son espace, sous un onglet à son nom, avec le même mot de passe.</p>';
    }
    var compte = findCompteByEmail(email, 'tuteur');
    if(compte){
      var pwdNote = compte.motDePasseDefini===false
        ? ', avec le mot de passe provisoire <strong>Provisoire2026!</strong> qu’il n’a pas encore changé.'
        : ', avec le même mot de passe que ses autres stagiaires suivis ici (pour des raisons de sécurité, ce mot de passe n’est plus affiché ici une fois défini par le tuteur — utilisez « Mot de passe oublié » sur l’écran de connexion si besoin).';
      return '<p class="hint-banner">Ce tuteur a déjà un accès (identifiant : <strong>'+esc(compte.pseudo)+'</strong>). Ce stagiaire apparaîtra automatiquement dans son espace, sous un nouvel onglet à son nom'+pwdNote+' Pour retirer son accès à ce stagiaire, videz ce champ e-mail et enregistrez ; si c’était son dernier stagiaire suivi, son compte sera automatiquement supprimé.</p>' +
        (compte.motDePasseDefini===false ? mailtoInviteHtml(compte.email, compte.nomAffiche, compte.pseudo, 'Provisoire2026!', 'tuteur') : '');
    }
    var pseudoPreview = pseudoFromFullName(v.tuteurNom);
    return '<p class="hint-banner">Nouvel accès tuteur : à l’enregistrement, un compte sera créé avec l’identifiant <strong>'+esc(pseudoPreview || '(généré à partir du nom une fois enregistré)')+'</strong> et le mot de passe provisoire <strong>Provisoire2026!</strong> ; le tuteur en choisira un nouveau à sa première connexion.</p>';
  }

  function renderFiche(st){
    var editable = isFullAccess();
    var lp = lastFilledPeriod(st);
    var risk = lp ? lp.risque : '';
    var backBtn = editable ? '<button type="button" class="btn btn-ghost" data-action="back-to-list">← Retour à la liste</button>' : '';
    var tabBtns = FICHE_TABS.map(function(t){
      var isUnread = view.role==='stagiaire' ? hasUnreadMessagesForStagiaire(st) : hasUnreadMessages(st);
      var flag = (t[0]==='messages' && isUnread) ? ' 🔔' : '';
      return '<button type="button" class="tab-btn '+(view.tab===t[0]?'active':'')+'" data-action="switch-tab" data-tab="'+t[0]+'">'+t[1]+flag+'</button>';
    }).join('');
    var body;
    if(view.tab==='suivi-stagiaire') body = renderSuiviStagiaireTab(st, editable);
    else if(view.tab==='suivi-tuteur') body = renderSuiviTuteurTab(st, editable);
    else if(view.tab==='planning') body = renderPlanningTab(st, editable);
    else if(view.tab==='documents') body = renderDocumentsTab(st, editable);
    else if(view.tab==='messages') body = renderMessagesTab(st);
    else if(view.tab==='referent-contact') body = renderReferentContactTab(editable);
    else body = renderInfosTab(st, editable);
    var moveFormation = editable ? (
      '<div class="move-formation"><select id="move-formation-select">' +
      FORMATIONS.map(function(f){ return '<option value="'+esc(f)+'" '+(st.formation===f?'selected':'')+'>'+esc(f)+'</option>'; }).join('') +
      '</select><button type="button" class="btn btn-sm" data-action="save-formation" data-id="'+esc(st.id)+'">Déplacer vers cette formation</button></div>'
    ) : '';
    return '' +
      backBtn +
      '<div class="fiche-header">' +
        '<div><h2>'+esc(fullName(st))+'</h2><div class="meta">'+esc(st.formation)+' · '+esc(st.structureNom)+'</div></div>' +
        '<span class="pill '+riskClass(risk)+'">'+riskLabel(risk)+'</span>' +
      '</div>' +
      moveFormation +
      '<div class="tabs">'+tabBtns+'</div>' +
      '<div class="card">'+body+'</div>';
  }

  function roItem(k,v){ return '<div class="ro-item"><div class="k">'+k+'</div><div class="v">'+esc(v||'—')+'</div></div>'; }

  var SELF_INFO_FIELDS = [
    ['prenom','Prénom'], ['nom','Nom'], ['telephone','Téléphone'], ['email','E-mail'],
    ['structureNom','Structure d’accueil'], ['structureAdresse','Adresse de la structure'],
    ['tuteurNom','Nom du tuteur'], ['tuteurTelephone','Téléphone tuteur'], ['tuteurEmail','E-mail tuteur']
  ];
  var STAGIAIRE_EDITABLE_FIELDS = ['prenom','nom','telephone','email','structureNom','structureAdresse','tuteurNom','tuteurTelephone','tuteurEmail'];
  var TUTEUR_EDITABLE_FIELDS = ['tuteurNom','tuteurTelephone','tuteurEmail'];

  function renderSelfInfosForm(st, editableFields, hintText){
    var editableHtml = SELF_INFO_FIELDS.filter(function(fd){ return editableFields.indexOf(fd[0])>=0; })
      .map(function(fd){
        var key=fd[0], label=fd[1];
        var type = (key==='email'||key==='tuteurEmail') ? 'email' : 'text';
        return '<div class="field"><label for="self-'+key+'">'+label+'</label><input id="self-'+key+'" type="'+type+'" value="'+esc(st[key])+'" /></div>';
      }).join('');
    var readonlyDefs = SELF_INFO_FIELDS.filter(function(fd){ return editableFields.indexOf(fd[0])<0; });
    var readonlyHtml = readonlyDefs.length ? '<h4 style="font-size:0.9rem;margin:18px 0 10px;">Autres informations</h4><div class="readonly-grid">' +
      readonlyDefs.map(function(fd){ return roItem(fd[1], st[fd[0]]); }).join('') + '</div>' : '';
    return '<p class="hint-banner">'+hintText+'</p>' +
      '<div class="form-grid">'+editableHtml+'</div>' +
      '<button type="button" class="btn btn-primary" data-action="save-self-infos" data-id="'+esc(st.id)+'">Enregistrer</button>' +
      readonlyHtml;
  }

  function renderInfosTab(st, editable){
    if(editable){
      var deleteBlock;
      if(view.confirmDeleteStagiaire){
        deleteBlock = '<div class="note-interne" style="margin-top:24px;border-color:var(--danger);">' +
          '<p style="margin:0 0 10px;color:var(--danger);font-weight:600;">Supprimer définitivement '+esc(fullName(st))+' et toutes ses données (planning, évaluations, documents, visites, messages) ? Cette action est irréversible.</p>' +
          '<button type="button" class="btn" style="background:var(--danger);color:#fff;border-color:var(--danger);" data-action="confirm-delete-stagiaire" data-id="'+esc(st.id)+'">Oui, supprimer définitivement</button> ' +
          '<button type="button" class="btn" data-action="cancel-delete-stagiaire">Annuler</button>' +
        '</div>';
      } else {
        deleteBlock = '<div style="margin-top:24px;"><button type="button" class="btn btn-sm" style="color:var(--danger);border-color:var(--danger);" data-action="ask-delete-stagiaire">Supprimer ce stagiaire</button></div>';
      }
      return infosFormFields(st, 'c-') + '<button type="button" class="btn btn-primary" data-action="save-infos" data-id="'+esc(st.id)+'" style="margin-top:6px;">Enregistrer les modifications</button>' + deleteBlock;
    }
    if(view.role==='stagiaire'){
      return renderSelfInfosForm(st, STAGIAIRE_EDITABLE_FIELDS, 'Complétez ou corrigez vos informations et celles de votre tuteur ci-dessous : elles sont enregistrées immédiatement, pour tout le monde.');
    }
    if(view.role==='tuteur'){
      return renderSelfInfosForm(st, TUTEUR_EDITABLE_FIELDS, 'Complétez ou corrigez vos coordonnées de tuteur pour ce stagiaire ci-dessous : elles sont enregistrées immédiatement.');
    }
    return '<div class="readonly-grid">' +
      roItem('Prénom', st.prenom) + roItem('Nom', st.nom) +
      roItem('Téléphone', st.telephone) + roItem('E-mail', st.email) +
      roItem('Structure d’accueil', st.structureNom) + roItem('Adresse de la structure', st.structureAdresse) +
      roItem('Tuteur', st.tuteurNom) + roItem('Téléphone tuteur', st.tuteurTelephone) +
      roItem('E-mail tuteur', st.tuteurEmail) +
    '</div>' +
    '<p class="hint-banner" style="margin-top:18px;">Une information a changé ? Écrivez-le au référent depuis l’onglet Messagerie.</p>';
  }

  // ---------- Mon suivi : bloc rapide (référent) ----------
  function periodQuickCard(p, idx, editable){
    if(editable){
      return '<div class="period-card"><h3>'+esc(p.periode)+'</h3><div class="period-grid">' +
        '<div class="field"><label for="s-'+idx+'-dateVisite">Date de la visite</label><input type="date" id="s-'+idx+'-dateVisite" value="'+esc(p.dateVisite)+'" /></div>' +
        '<div class="field"><label for="s-'+idx+'-prochaineVisite">Prochaine visite prévue</label><input type="date" id="s-'+idx+'-prochaineVisite" value="'+esc(p.prochaineVisite)+'" /></div>' +
        '<div class="field"><label for="s-'+idx+'-risque">Niveau de risque de rupture</label><select id="s-'+idx+'-risque">' +
          ['','faible','moyen','eleve'].map(function(r){ return '<option value="'+r+'" '+(p.risque===r?'selected':'')+'>'+(r?riskLabel(r):'Non renseigné')+'</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"></div>' +
        '</div>' +
        '<div class="note-interne"><label for="s-'+idx+'-noteInterne">Note interne (visible par le référent et les coordinateurs uniquement)</label><textarea id="s-'+idx+'-noteInterne">'+esc(p.noteInterne)+'</textarea></div>' +
      '</div>';
    }
    return '<div class="period-card"><h3>'+esc(p.periode)+' <span class="pill '+riskClass(p.risque)+'" style="margin-left:8px;">'+riskLabel(p.risque)+'</span></h3>' +
      '<div class="readonly-grid">' +
      roItem('Date de la visite', fmtDate(p.dateVisite)) + roItem('Prochaine visite prévue', fmtDate(p.prochaineVisite)) +
      '</div></div>';
  }

  // ---------- Mon suivi : feuille détaillée ----------
  function textBlock(idx, field, value, label, editable){
    if(editable){
      return '<div class="field full"><label for="d-'+idx+'-'+field+'">'+label+'</label><textarea id="d-'+idx+'-'+field+'">'+esc(value)+'</textarea></div>';
    }
    return '<div class="field"><div class="k" style="font-size:.72rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px;">'+label+'</div><div class="ro-text">'+esc(value||'—')+'</div></div>';
  }

  function critGrid(list, values, idPrefix, idx, editable){
    // Note: rendered as a plain row list (not a table inside an overflow-x
    // container) so a native <select>'s dropdown never gets clipped by an
    // ancestor's scroll box.
    if(editable){
      var rows = list.map(function(c){
        return '<div class="rating-row"><div class="crit-label">'+c[1]+'</div><select id="'+idPrefix+'-'+idx+'-'+c[0]+'">' +
          CRIT_LEVELS.map(function(l){ return '<option value="'+l[0]+'" '+(values[c[0]]===l[0]?'selected':'')+'>'+l[1]+'</option>'; }).join('') +
        '</select></div>';
      }).join('');
      return '<div class="rating-list"><div class="rating-head"><span>Critère</span><span>Note (0 à 4)</span></div>'+rows+'</div>';
    }
    var rows2 = list.map(function(c){ return '<div class="rating-row"><div class="crit-label">'+c[1]+'</div><div class="rating-value">'+(values[c[0]] ? values[c[0]] : '—')+'</div></div>'; }).join('');
    return '<div class="rating-list"><div class="rating-head"><span>Critère</span><span>Note</span></div>'+rows2+'</div>';
  }

  function ucBlockHtml(block, values, idx, editable){
    var rows;
    if(editable){
      rows = block.items.map(function(it){
        return '<div class="rating-row"><div class="crit-label">'+esc(it[1])+'</div><select id="uc-'+idx+'-'+it[0]+'">' +
          UC_LEVELS.map(function(l){ return '<option value="'+l[0]+'" '+(values[it[0]]===l[0]?'selected':'')+'>'+l[1]+'</option>'; }).join('') +
        '</select></div>';
      }).join('');
    } else {
      rows = block.items.map(function(it){ return '<div class="rating-row"><div class="crit-label">'+esc(it[1])+'</div><div class="rating-value">'+ucLevelLabel(values[it[0]])+'</div></div>'; }).join('');
    }
    return '<h4 class="suivi-subtitle">'+esc(block.titre)+'</h4><div class="rating-list"><div class="rating-head"><span>Compétence</span><span>Niveau</span></div>'+rows+'</div>';
  }

  function syncTasksBufferFromDom(){
    if(!tasksEditBuffer) return;
    tasksEditBuffer.forEach(function(t, ri){
      var el = document.getElementById('tk-'+ri+'-type');
      if(el){ t.type = getVal('tk-'+ri+'-type'); t.volume = getVal('tk-'+ri+'-volume'); t.details = getVal('tk-'+ri+'-details'); }
    });
  }
  function ensureTasksBuffer(st, idx){
    var key = st.id+'|'+idx;
    if(!tasksEditBuffer || tasksEditBuffer._for !== key){
      var clone = deepClone(st.evaluations[idx].taches);
      if(!clone.length) clone.push({type:'',volume:'',details:''});
      clone._for = key;
      tasksEditBuffer = clone;
    }
    return tasksEditBuffer;
  }

  function renderTasksBlock(st, idx, editable){
    var out = '<div class="field"><label style="margin-bottom:8px;">Types de tâches réalisées</label>';
    if(editable){
      var buf = ensureTasksBuffer(st, idx);
      out += buf.map(function(t,ri){
        return '<div class="doc-row"><div class="grow field" style="margin-bottom:0;"><input id="tk-'+ri+'-type" value="'+esc(t.type)+'" placeholder="Type de tâche" /></div>' +
          '<div class="field" style="margin-bottom:0;max-width:140px;"><input id="tk-'+ri+'-volume" value="'+esc(t.volume)+'" placeholder="Volume horaire" /></div>' +
          '<div class="grow field" style="margin-bottom:0;"><input id="tk-'+ri+'-details" value="'+esc(t.details)+'" placeholder="Détails" /></div>' +
          '<button type="button" class="btn btn-sm" data-action="remove-task-row" data-idx="'+ri+'">Retirer</button></div>';
      }).join('');
      out += '<button type="button" class="btn btn-sm" data-action="add-task-row">+ Ajouter une tâche</button>';
    } else {
      var taches = st.evaluations[idx].taches;
      if(!taches.length){ out += '<p class="ro-text" style="color:var(--text-muted);">Aucune tâche renseignée.</p>'; }
      else {
        out += '<div class="table-wrap"><table><thead><tr><th>Type de tâche</th><th>Volume horaire</th><th>Détails</th></tr></thead><tbody>' +
          taches.map(function(t){ return '<tr><td>'+esc(t.type)+'</td><td>'+esc(t.volume)+'</td><td>'+esc(t.details)+'</td></tr>'; }).join('') +
        '</tbody></table></div>';
      }
    }
    out += '</div>';
    return out;
  }

  function periodSubTabs(dp){
    return [0,1,2].map(function(i){
      return '<button type="button" class="tab-btn small '+(dp===i?'active':'')+'" data-action="switch-detail-period" data-idx="'+i+'">Période '+(i+1)+'</button>';
    }).join('');
  }

  function renderDetailPeriodStagiaire(st, idx, editable){
    var d = st.evaluations[idx];
    var html = '';
    html += renderTasksBlock(st, idx, editable);
    html += textBlock(idx,'competencesAcquisesStagiaire', d.competencesAcquisesStagiaire, 'Les compétences acquises par le/la stagiaire', editable);
    html += textBlock(idx,'difficultesStagiaire', d.difficultesStagiaire, 'Les difficultés rencontrées', editable);
    html += textBlock(idx,'remarquesStagiaire', d.remarquesStagiaire, 'Autres remarques', editable);
    html += '<h4 class="suivi-subtitle">Critères</h4>';
    html += critGrid(CRIT1, d.criteres1, 'c1', idx, editable);
    html += '<h4 class="suivi-subtitle">Grille complémentaire</h4>';
    html += critGrid(CRIT2, d.criteres2, 'c2', idx, editable);
    html += '<h4 class="suivi-subtitle">Référentiel de compétences</h4>';
    html += ucBlocksForFormation(st.formation).map(function(b){ return ucBlockHtml(b, d.uc, idx, editable); }).join('');
    if(editable){
      html += '<button type="button" class="btn btn-primary" data-action="save-detail-stagiaire" data-id="'+esc(st.id)+'" data-idx="'+idx+'" style="margin-top:10px;">Enregistrer cette période</button>';
    }
    return html;
  }

  function renderDetailPeriodTuteur(st, idx, editable){
    var d = st.evaluations[idx];
    var html = '';
    html += textBlock(idx,'tuteurCompetencesAcquises', d.tuteurCompetencesAcquises, 'Les compétences acquises', editable);
    html += '<h4 class="suivi-subtitle">Critères</h4>';
    html += critGrid(CRIT1, d.criteres1, 'c1', idx, editable);
    html += textBlock(idx,'tuteurDifficultes', d.tuteurDifficultes, "Les difficultés rencontrées par le tuteur", editable);
    html += textBlock(idx,'tuteurRemarques', d.tuteurRemarques, 'Autres remarques', editable);
    if(editable){
      html += '<button type="button" class="btn btn-primary" data-action="save-detail-tuteur" data-id="'+esc(st.id)+'" data-idx="'+idx+'" style="margin-top:10px;">Enregistrer cette période</button>';
    }
    return html;
  }

  function renderSuiviStagiaireTab(st, editable){
    var quickCards = st.suivis.map(function(p,idx){ return periodQuickCard(p, idx, editable); }).join('');
    var dp = view.detailPeriod || 0;
    var canEditStagiaire = editable || view.role==='stagiaire';
    return '' +
      '<h3 class="suivi-section-title">Suivi rapide</h3>' +
      quickCards +

  function planningTable(list, kind, editable){
    var labelCol = kind==='structure' ? 'Activité en structure' : 'Module à Dojo Academy';
    var field = kind==='structure' ? 'activite' : 'module';
    var prefix = kind==='structure' ? 'pS-' : 'pD-';
    if(editable){
      var rows = list.map(function(row,idx){
        return '<tr><td>'+row.jour+'</td>' +
          '<td><input id="'+prefix+idx+'-h" value="'+esc(row.horaires)+'" placeholder="ex. 9h-17h" /></td>' +
          '<td><input id="'+prefix+idx+'-a" value="'+esc(row[field])+'" placeholder="ex. '+(kind==='structure'?'Encadrement cours enfants':'Pédagogie sportive')+'" /></td></tr>';
      }).join('');
      return '<div class="table-wrap"><table><thead><tr><th>Jour</th><th>Horaires</th><th>'+labelCol+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }
    var filtered = list.filter(function(r){ return r.horaires || r[field]; });
    if(!filtered.length) return '<p class="ro-text" style="color:var(--text-muted);">Aucun créneau renseigné.</p>';
    var rows2 = filtered.map(function(row){ return '<tr><td>'+esc(row.jour)+'</td><td>'+esc(row.horaires)+'</td><td>'+esc(row[field])+'</td></tr>'; }).join('');
    return '<div class="table-wrap"><table><thead><tr><th>Jour</th><th>Horaires</th><th>'+labelCol+'</th></tr></thead><tbody>'+rows2+'</tbody></table></div>';

  function renderDocumentsTab(st, editable){

        '<div class="grow field" style="margin-bottom:0;"><label>Lien (Drive, cloud...)</label><input id="doc-'+idx+'-lien" value="'+esc(d.lien)+'" placeholder="https://..." /></div>' +
        '<div class="field" style="margin-bottom:0; max-width:160px;"><label>Date</label><input type="date" id="doc-'+idx+'-date" value="'+esc(d.date)+'" /></div>' +
        '<button type="button" class="btn btn-sm" data-action="remove-doc-row" data-idx="'+idx+'">Retirer</button>' +

      '<button type="button" class="btn btn-primary" data-action="save-documents" data-id="'+esc(st.id)+'">Enregistrer la liste</button> ' +

  function visiteTypeLabel(type){ var t = VISITE_TYPES.filter(function(v){ return v[0]===type; })[0]; return t ? t[1] : type; }

  function emptyVisite(type, st){
    var a = actorInfo();

      base.deroulement = {}; VISITE_DEROULEMENT.forEach(function(e){ base.deroulement[e[0]] = ''; });

  var visiteEditBuffer = null;

  // -- petits composants de champ --
  function vField(id, type, label, value, full){
    var inner;
    if(type==='date') inner = '<input type="date" id="v-'+id+'" value="'+esc(value)+'" />';
    else if(type==='textarea') inner = '<textarea id="v-'+id+'">'+esc(value)+'</textarea>';
    else if(type==='appreciation') inner = '<select id="v-'+id+'">' + APPRECIATIONS.map(function(a){ return '<option value="'+a[0]+'" '+(value===a[0]?'selected':'')+'>'+esc(a[1])+'</option>'; }).join('') + '</select>';
    else inner = '<input type="text" id="v-'+id+'" value="'+esc(value)+'" />';
    return '<div class="field'+(full?' full':'')+'"><label for="v-'+id+'">'+esc(label)+'</label>'+inner+'</div>';
  }
  function vReadField(id, label, value){
    return '<div class="field"><label>'+esc(label)+'</label><div class="ro-text">'+esc(value||'—')+'</div></div>';
  }

  // -- grille à lignes fixes, 1 ou 2 colonnes éditables (déroulement, grille d'observation, axes) --
  function visiteGridEditable(rowsDef, cols, values, idPrefix){
    var headExtra = cols.map(function(c){ return '<span>'+esc(c[1])+'</span>'; }).join('');
    var rows = rowsDef.map(function(r){
      var key = r[0], label = r[1];
      var cells = cols.map(function(c){
        var val = cols.length===1 ? (values[key]||'') : ((values[key]||{})[c[0]]||'');
        return '<textarea id="'+idPrefix+'-'+key+'-'+c[0]+'" rows="2">'+esc(val)+'</textarea>';
      }).join('');
      return '<div class="rating-row rating-row-wide"><div class="crit-label">'+esc(label)+'</div>'+cells+'</div>';
    }).join('');
    return '<div class="rating-list rating-list-wide"><div class="rating-head rating-head-wide"><span>&nbsp;</span>'+headExtra+'</div>'+rows+'</div>';
  }
  function visiteGridReadOnly(rowsDef, cols, values){
    var headExtra = cols.map(function(c){ return '<span>'+esc(c[1])+'</span>'; }).join('');
    var rows = rowsDef.map(function(r){
      var key = r[0], label = r[1];
      var cells = cols.map(function(c){
        var val = cols.length===1 ? (values[key]||'') : ((values[key]||{})[c[0]]||'');
        return '<div class="ro-text">'+esc(val||'—')+'</div>';
      }).join('');
      return '<div class="rating-row rating-row-wide"><div class="crit-label">'+esc(label)+'</div>'+cells+'</div>';
    }).join('');
    return '<div class="rating-list rating-list-wide"><div class="rating-head rating-head-wide"><span>&nbsp;</span>'+headExtra+'</div>'+rows+'</div>';
  }

  // -- tableau "Déroulement de la visite" : colonnes Étape / Contenu / Durée fixes + Observations éditable --
  function deroulementTable(buffer){
    var rows = VISITE_DEROULEMENT.map(function(e){
      var key=e[0], label=e[1], contenu=e[2], duree=e[3];
      var val = buffer.deroulement[key]||'';
      return '<tr><td><strong>'+esc(label)+'</strong></td><td>'+esc(contenu)+'</td><td>'+esc(duree)+'</td>' +
        '<td><textarea id="vd-'+key+'" rows="2" style="width:100%;">'+esc(val)+'</textarea></td></tr>';
    }).join('');
    return '<div class="table-wrap"><table><thead><tr><th>Étape</th><th>Contenu / Objectif</th><th>Durée estimée</th><th>Observations / Notes</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  function deroulementTableReadOnly(v){
    var rows = VISITE_DEROULEMENT.map(function(e){
      var key=e[0], label=e[1], contenu=e[2], duree=e[3];
      var val = (v.deroulement||{})[key]||'';
      return '<tr><td><strong>'+esc(label)+'</strong></td><td>'+esc(contenu)+'</td><td>'+esc(duree)+'</td><td>'+esc(val||'—')+'</td></tr>';
    }).join('');
    return '<div class="table-wrap"><table><thead><tr><th>Étape</th><th>Contenu / Objectif</th><th>Durée estimée</th><th>Observations / Notes</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  // -- tableaux à lignes libres (remédiations, évaluation, objectifs) --
  function editableRowsTable(buffer, field, columns, addLabel){
    var rows = buffer[field] || [];
    var head = '<div class="doc-row" style="font-weight:600;font-size:.76rem;color:var(--text-muted);">' +
      columns.map(function(c){ return '<div class="grow field" style="margin-bottom:0;">'+esc(c[1])+'</div>'; }).join('') + '<div style="width:70px;"></div></div>';
    var body = rows.map(function(r, ri){
      return '<div class="doc-row">' + columns.map(function(c){
        return '<div class="grow field" style="margin-bottom:0;"><input id="vt-'+field+'-'+ri+'-'+c[0]+'" value="'+esc(r[c[0]]||'')+'" placeholder="'+esc(c[1])+'" /></div>';
      }).join('') + '<button type="button" class="btn btn-sm" data-action="remove-visite-row" data-field="'+field+'" data-idx="'+ri+'">Retirer</button></div>';
    }).join('');
    var empty = !rows.length ? '<p class="ro-text" style="color:var(--text-muted);margin:4px 0 8px;">Aucune ligne pour le moment.</p>' : '';
    return '<div class="field full">' + head + empty + body +
      '<button type="button" class="btn btn-sm" data-action="add-visite-row" data-field="'+field+'" style="margin-top:6px;">'+esc(addLabel||'+ Ajouter une ligne')+'</button></div>';

  function readOnlyRowsTable(rows, columns){

      rows.map(function(r){ return '<tr>'+columns.map(function(c){ return '<td>'+esc(r[c[0]]||'—')+'</td>'; }).join('')+'</tr>'; }).join('') +
      '</tbody></table></div>';

  // -- synchronisation DOM -> buffer avant tout ajout/retrait de ligne, pour ne perdre aucune saisie --
  function syncVisiteBufferFromDom(){
    var buffer = visiteEditBuffer;
    if(!buffer) return;
    buffer.dateVisite = getVal('v-dateVisite');
    buffer.referent = getVal('v-referent');
    if(buffer.type==='visite'){
      VISITE_DEROULEMENT.forEach(function(e){ buffer.deroulement[e[0]] = getVal('vd-'+e[0]); });
      VISITE_GRILLE_OBSERVATION.forEach(function(e){
        buffer.grille[e[0]] = { positifs: getVal('vg-'+e[0]+'-positifs'), axes: getVal('vg-'+e[0]+'-axes') };
      });
      buffer.pointsForts = getVal('v-pointsForts');
      buffer.axesAmelioration = getVal('v-axesAmelioration');
      buffer.decisionsSuivis = getVal('v-decisionsSuivis');
    } else if(buffer.type==='bilan'){
      buffer.dureeSeance = getVal('v-dureeSeance'); buffer.publicConcerne = getVal('v-publicConcerne');
      buffer.thematiqueSeance = getVal('v-thematiqueSeance'); buffer.contexteVisite = getVal('v-contexteVisite');
      BILAN_AXES.forEach(function(a){ buffer.axes[a[0]] = { positifs: getVal('vg-'+a[0]+'-positifs'), ameliorer: getVal('vg-'+a[0]+'-ameliorer') }; });
      buffer.observationsFormateur = getVal('v-observationsFormateur');
      buffer.appreciation = getVal('v-appreciation'); buffer.commentaireGeneral = getVal('v-commentaireGeneral');
      syncRowsTableFromDom(buffer, 'remediationsProposees', REMEDIATION_COLS);
    } else if(buffer.type==='remediation'){
      buffer.datePrecedenteVisite = getVal('v-datePrecedenteVisite');
      syncRowsTableFromDom(buffer, 'remediationsPrecedentes', REMEDIATION_COLS);
      syncRowsTableFromDom(buffer, 'evaluationRemediations', EVALUATION_REMEDIATION_COLS);
      buffer.comportementProfessionnel = getVal('v-comportementProfessionnel');
      buffer.competencesTechniquesPedagogiques = getVal('v-competencesTechniquesPedagogiques');
      buffer.postureEngagement = getVal('v-postureEngagement');
      syncRowsTableFromDom(buffer, 'nouveauxObjectifs', OBJECTIFS_COLS);
      buffer.appreciation = getVal('v-appreciation'); buffer.commentaireGeneral = getVal('v-commentaireGeneral');
    }
  }
  function syncRowsTableFromDom(buffer, field, columns){
    (buffer[field]||[]).forEach(function(r, ri){
      var probe = document.getElementById('vt-'+field+'-'+ri+'-'+columns[0][0]);
      if(!probe) return;
      columns.forEach(function(c){ r[c[0]] = getVal('vt-'+field+'-'+ri+'-'+c[0]); });
    });
  }
  function emptyRowFor(columns){
    var o = {}; columns.forEach(function(c){ o[c[0]] = ''; }); return o;
  }

  // ---------- actions ----------
  function readInfosFromForm(target, prefix){
    var fields = ['prenom','nom','telephone','email','structureNom','structureAdresse','tuteurNom','tuteurTelephone','tuteurEmail','identifiantStagiaire','motDePasseStagiaire'];
    fields.forEach(function(f){ target[f] = getVal(prefix+f); });
    if(!target.identifiantStagiaire){ target.identifiantStagiaire = pseudoFromName(target.prenom, target.nom); }
    if(target.motDePasseStagiaire){ target.motDePasseDefiniStagiaire = true; }
    // L’accès tuteur n’est plus saisi ici : il est géré automatiquement par
    // ensureTuteurComptes() à partir de l’adresse e-mail du tuteur (rattachement
    // et compte partagé entre tous les stagiaires suivis par le même tuteur).
    delete target.identifiantTuteur;
    delete target.motDePasseTuteur;
    delete target.motDePasseDefiniTuteur;
  }

  function resetNav(){
    view.tab = 'infos'; view.detailPeriod = 0; docEditBuffer=null; tasksEditBuffer=null; visiteEditBuffer=null; view.confirmDeleteStagiaire=false;
  }

  function onClick(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');

    if(action==='submit-login'){ doLogin(); return; }
    if(action==='change-profile'){
      docEditBuffer = null; tasksEditBuffer = null; visiteEditBuffer = null;
      view = { screen:'login', role:null, profileId:null, selectedFormation:null, selectedId:null, tab:'infos', showAdd:false, detailPeriod:0 };
      saveView(); render(); return;
    }
    if(action==='toggle-forgot'){
      view.forgotOpen = !view.forgotOpen; view.forgotStage = 'email'; view.forgotTarget = null;
      saveView(); render(); return;
    }
    if(action==='forgot-submit-email'){
      var forgotEmail = getVal('forgot-email');
      findAccountByEmail(forgotEmail).then(function(foundAcc){
        if(!foundAcc){ showToast('Aucun compte trouvé avec cette adresse e-mail.'); return; }
        view.forgotTarget = foundAcc; view.forgotStage = 'reset';
        saveView(); render();
      });
      return;
    }
    if(action==='forgot-submit-reset'){
      var fnp = getVal('forgot-new-pass');
      var fnp2 = getVal('forgot-new-pass2');
      if(!fnp || fnp.length<4){ showToast('Le mot de passe doit contenir au moins 4 caractères.'); return; }
      if(fnp!==fnp2){ showToast('Les deux mots de passe ne correspondent pas.'); return; }
      var resetTarget = view.forgotTarget;
      view.forgotOpen = false; view.forgotStage = 'email'; view.forgotTarget = null;
      saveView(); render();
      if(resetTarget){
        applyPasswordReset(resetTarget, fnp).then(function(ok){
          if(ok){
            if(resetTarget.kind==='compte'){ var c=findCompte(resetTarget.id); if(c) c.motDePasseDefini=true; }
            else { var s=findStagiaire(resetTarget.id); if(s) s.motDePasseDefiniStagiaire=true; }
            showToast('Mot de passe mis à jour. Vous pouvez vous connecter.');
          } else {
            showToast('Le mot de passe n’a pas pu être mis à jour.');
          }
        });
      }
      return;
    }
    if(action==='submit-setup-password'){
      var snp = getVal('setup-new-pass');
      var snp2 = getVal('setup-new-pass2');
      if(!snp || snp.length<4){ showToast('Le mot de passe doit contenir au moins 4 caractères.'); return; }
      if(snp!==snp2){ showToast('Les deux mots de passe ne correspondent pas.'); return; }
      var setupRole = view.role, setupProfileId = view.profileId;
      var setupKind = setupRole==='stagiaire' ? 'stagiaire' : 'compte';
      applyPasswordReset({kind:setupKind, id:setupProfileId}, snp).then(function(ok){
        if(!ok){ showToast('Le mot de passe n’a pas pu être défini.'); return; }
        view = { screen:'app', role:setupRole, profileId:setupProfileId, selectedFormation:null, selectedId:null, tab:'infos', showAdd:false, detailPeriod:0 };
        saveView(); render();
      });
      return;
    }
    if(action==='toggle-account-panel'){
      view.accountPanelOpen = !view.accountPanelOpen; saveView(); render(); return;
    }
    if(action==='close-account-panel'){
      view.accountPanelOpen = false; saveView(); render(); return;
    }
    if(action==='submit-change-password'){
      var accCur = getVal('acc-current');
      var accNew = getVal('acc-new');
      var accNew2 = getVal('acc-new2');
      if(!accNew || accNew.length<4){ showToast('Le nouveau mot de passe doit contenir au moins 4 caractères.'); return; }
      if(accNew!==accNew2){ showToast('Les deux mots de passe ne correspondent pas.'); return; }
      var ownKind = view.role==='stagiaire' ? 'stagiaire' : 'compte';
      applyOwnPasswordChange(ownKind, view.profileId, accCur, accNew).then(function(ok){
        if(!ok){ showToast('Mot de passe actuel incorrect.'); return; }
        view.accountPanelOpen = false;
        saveView(); render();
        showToast('Mot de passe mis à jour.');
      });
      return;
    }
    if(action==='open-formation'){
      view.selectedFormation = el.getAttribute('data-formation'); view.selectedId=null; view.showAdd=false; view.accountPanelOpen=false;
      saveView(); render(); return;
    }
    if(action==='back-to-formations'){
      view.selectedFormation = null; view.selectedId = null; view.showAdd=false; view.accountPanelOpen=false;
      saveView(); render(); return;
    }
    if(action==='open-stagiaire'){
      var stOpen = findStagiaire(id);
      view.selectedId = id;
      if(stOpen) view.selectedFormation = stOpen.formation;
      resetNav(); view.accountPanelOpen=false; saveView(); render(); return;
    }
    if(action==='back-to-list'){
      view.selectedId = null; docEditBuffer=null; tasksEditBuffer=null; visiteEditBuffer=null; view.confirmDeleteStagiaire=false; view.accountPanelOpen=false; saveView(); render(); return;
    }
    if(action==='switch-tab'){
      view.tab = el.getAttribute('data-tab'); view.detailPeriod = 0; docEditBuffer=null; tasksEditBuffer=null; visiteEditBuffer=null; view.confirmDeleteStagiaire=false;
      saveView(); render(); return;
    }
    if(action==='switch-tuteur-stagiaire'){
      view.selectedId = id; view.tab = 'infos'; view.detailPeriod = 0; docEditBuffer=null; tasksEditBuffer=null; visiteEditBuffer=null; view.confirmDeleteStagiaire=false;
      saveView(); render(); return;
    }
    if(action==='switch-detail-period'){
      view.detailPeriod = parseInt(el.getAttribute('data-idx'),10); tasksEditBuffer=null;
      saveView(); render(); return;
    }
    if(action==='toggle-add-form'){
      view.showAdd = !view.showAdd; saveView(); render(); return;
    }
    if(action==='submit-add-stagiaire'){
      var formationForNew = el.getAttribute('data-formation') || FORMATIONS[0];
      var nst = emptyStagiaire(formationForNew);
      readInfosFromForm(nst, 'add-');
      if(!nst.prenom || !nst.nom){ showToast('Merci de renseigner au moins le prénom et le nom.'); return; }
      var newPwd = nst.motDePasseStagiaire;
      sb.rpc('rpc_create_stagiaire', { p_data: nst, p_password: newPwd || null }).then(function(res){
        if(res.error || !res.data){ showToast('Impossible d’ajouter ce stagiaire : '+(res.error?res.error.message:'')); return; }
        nst.id = res.data;
        nst.motDePasseDefiniStagiaire = !!newPwd;
        if(!newPwd) nst.motDePasseStagiaire = 'Provisoire2026!';
        DATA.stagiaires.push(nst);
        view.showAdd = false; view.selectedId = nst.id; view.selectedFormation = formationForNew; resetNav();
        saveView(); render();
      });
      return;
    }
    if(action==='save-formation'){
      var newF = getVal('move-formation-select');
      if(!newF) return;
      view.selectedFormation = newF;
      updateStagiaire(id, function(s){ s.formation = newF; });
      return;
    }
    if(action==='save-infos'){
      var newPwdInfos = getVal('c-motDePasseStagiaire');
      updateStagiaire(id, function(s){ readInfosFromForm(s, 'c-'); });
      if(newPwdInfos){
        applyPasswordReset({kind:'stagiaire', id:id}, newPwdInfos).then(function(ok){
          if(ok){ var s=findStagiaire(id); if(s){ s.motDePasseDefiniStagiaire=true; render(); } showToast('Informations et mot de passe enregistrés.'); }
          else { showToast('Les informations sont enregistrées, mais le mot de passe n’a pas pu être mis à jour.'); }
        });
      }
      return;
    }
    if(action==='ask-delete-stagiaire'){
      view.confirmDeleteStagiaire = true; saveView(); render(); return;
    }
    if(action==='cancel-delete-stagiaire'){
      view.confirmDeleteStagiaire = false; saveView(); render(); return;
    }
    if(action==='confirm-delete-stagiaire'){
      view.confirmDeleteStagiaire = false; view.selectedId = null; view.selectedFormation = null; resetNav();
      saveView(); render();
      sb.rpc('rpc_delete_stagiaire', { p_id: id }).then(function(res){
        if(res.error){ showToast('Suppression impossible : '+res.error.message); return; }
        DATA.stagiaires = DATA.stagiaires.filter(function(s){ return s.id!==id; });
        render();
        showToast('Stagiaire supprimé.');
      });
      return;
    }
    if(action==='copy-invite'){
      var invEmail = el.getAttribute('data-invite-email');
      var invPrenom = el.getAttribute('data-invite-prenom');
      var invId = el.getAttribute('data-invite-id');
      var invPwd = el.getAttribute('data-invite-pwd');
      var invRole = el.getAttribute('data-invite-role');
      var invText = 'À : '+invEmail+'\nObjet : Vos identifiants de connexion — Suivi Alternance (Dojo Academy)\n\nBonjour '+invPrenom+',\n\nVoici vos identifiants pour accéder à votre espace '+invRole+' sur Suivi Alternance :\n\nIdentifiant : '+invId+'\nMot de passe provisoire : '+invPwd+'\n\nVous devrez choisir un nouveau mot de passe lors de votre première connexion.\n\nCordialement,\nDojo Academy';
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(invText).then(function(){
          showToast('Message copié : collez-le dans un e-mail, SMS ou messagerie.');
        }).catch(function(){
          showToast('Impossible de copier automatiquement le message.');
        });
      } else {
        showToast('Copie non disponible dans ce navigateur.');
      }
      return;
    }
    if(action==='save-suivi'){
      updateStagiaire(id, function(s){
        s.suivis.forEach(function(p, idx){
          p.dateVisite = getVal('s-'+idx+'-dateVisite');
          p.prochaineVisite = getVal('s-'+idx+'-prochaineVisite');
          p.risque = getVal('s-'+idx+'-risque');
          p.noteInterne = getVal('s-'+idx+'-noteInterne');
        });
      }); return;
    }
    if(action==='add-task-row'){
      syncTasksBufferFromDom();
      tasksEditBuffer.push({type:'',volume:'',details:''});
      render(); return;
    }
    if(action==='remove-task-row'){
      syncTasksBufferFromDom();
      var ti = parseInt(el.getAttribute('data-idx'),10);
      tasksEditBuffer.splice(ti,1);
      render(); return;
    }
    if(action==='save-detail-stagiaire'){
      var pidxS = parseInt(el.getAttribute('data-idx'),10);
      syncTasksBufferFromDom();
      var cleanedTasks = (tasksEditBuffer||[]).filter(function(t){ return t.type || t.volume || t.details; }).map(function(t){ return {type:t.type,volume:t.volume,details:t.details}; });
      tasksEditBuffer = null;
      updateStagiaire(id, function(s){
        var d = s.evaluations[pidxS];
        d.taches = cleanedTasks;
        d.competencesAcquisesStagiaire = getVal('d-'+pidxS+'-competencesAcquisesStagiaire');
        d.difficultesStagiaire = getVal('d-'+pidxS+'-difficultesStagiaire');
        d.remarquesStagiaire = getVal('d-'+pidxS+'-remarquesStagiaire');
        CRIT1.forEach(function(c){ d.criteres1[c[0]] = getVal('c1-'+pidxS+'-'+c[0]); });
        CRIT2.forEach(function(c){ d.criteres2[c[0]] = getVal('c2-'+pidxS+'-'+c[0]); });
        ucBlocksForFormation(s.formation).forEach(function(b){ b.items.forEach(function(it){ d.uc[it[0]] = getVal('uc-'+pidxS+'-'+it[0]); }); });
      });
      return;
    }
    if(action==='save-detail-tuteur'){
      var pidxT = parseInt(el.getAttribute('data-idx'),10);
      updateStagiaire(id, function(s){
        var d = s.evaluations[pidxT];
        d.tuteurCompetencesAcquises = getVal('d-'+pidxT+'-tuteurCompetencesAcquises');
        CRIT1.forEach(function(c){ d.criteres1[c[0]] = getVal('c1-'+pidxT+'-'+c[0]); });
        d.tuteurDifficultes = getVal('d-'+pidxT+'-tuteurDifficultes');
        d.tuteurRemarques = getVal('d-'+pidxT+'-tuteurRemarques');
      });
      return;
    }
    if(action==='print-stagiaire-sheet'){
      var stDlS = findStagiaire(id);
      if(stDlS) printSheet('Suivi_stagiaire_'+slugify(fullName(stDlS)), buildStagiaireSheetBlocks(stDlS), 'Feuille de suivi stagiaire — '+fullName(stDlS));
      return;
    }
    if(action==='print-tuteur-sheet'){
      var stDlT = findStagiaire(id);
      if(stDlT) printSheet('Suivi_tuteur_'+slugify(fullName(stDlT)), buildTuteurSheetBlocks(stDlT), 'Feuille de suivi tuteur — '+fullName(stDlT));
      return;
    }
    if(action==='new-visite'){
      var stNv = findStagiaire(id);
      var vType = el.getAttribute('data-type');
      if(stNv) visiteEditBuffer = emptyVisite(vType, stNv);
      render(); return;
    }
    if(action==='open-visite'){
      var stOv = findStagiaire(id);
      var vidOpen = el.getAttribute('data-visite');
      var vOpen = stOv ? stOv.visites.filter(function(x){ return x.id===vidOpen; })[0] : null;
      if(vOpen){ visiteEditBuffer = deepClone(vOpen); visiteEditBuffer._existingId = vOpen.id; }
      render(); return;
    }
    if(action==='close-visite'){
      visiteEditBuffer = null; render(); return;
    }
    if(action==='save-visite'){
      syncVisiteBufferFromDom();
      var bufferToSave = visiteEditBuffer;
      var existingId = bufferToSave._existingId;
      var toStore = deepClone(bufferToSave);
      delete toStore._existingId;
      visiteEditBuffer = null;
      updateStagiaire(id, function(s){
        if(!s.visites) s.visites = [];
        if(existingId){
          var iFound = -1;
          for(var vi=0; vi<s.visites.length; vi++){ if(s.visites[vi].id===existingId){ iFound = vi; break; } }
          if(iFound>=0) s.visites[iFound] = toStore; else s.visites.push(toStore);
        } else {
          s.visites.push(toStore);
        }
      });
      showToast('Fiche de visite enregistrée.');
      return;
    }
    if(action==='delete-visite'){
      var vidDel = el.getAttribute('data-visite');
      updateStagiaire(id, function(s){
        s.visites = (s.visites||[]).filter(function(x){ return x.id!==vidDel; });
      });
      return;
    }
    if(action==='print-visite'){
      var stDv = findStagiaire(id);
      var vidDl = el.getAttribute('data-visite');
      var vDl = stDv ? stDv.visites.filter(function(x){ return x.id===vidDl; })[0] : null;
      if(stDv && vDl){
        printSheet(slugify(visiteTypeLabel(vDl.type))+'_'+slugify(fullName(stDv))+'_'+(vDl.dateVisite||''), buildVisiteBlocks(vDl, stDv), visiteTypeLabel(vDl.type)+' — '+fullName(stDv));
      }
      return;
    }
    if(action==='add-visite-row'){
      syncVisiteBufferFromDom();
      var addField = el.getAttribute('data-field');
      var addCols = addField==='remediationsProposees' || addField==='remediationsPrecedentes' ? REMEDIATION_COLS :
        addField==='evaluationRemediations' ? EVALUATION_REMEDIATION_COLS : OBJECTIFS_COLS;
      if(!visiteEditBuffer[addField]) visiteEditBuffer[addField] = [];
      visiteEditBuffer[addField].push(emptyRowFor(addCols));
      render(); return;
    }
    if(action==='remove-visite-row'){
      syncVisiteBufferFromDom();
      var remField = el.getAttribute('data-field');
      var remIdx = parseInt(el.getAttribute('data-idx'),10);
      visiteEditBuffer[remField].splice(remIdx,1);
      render(); return;
    }
    if(action==='save-planning'){
      updateStagiaire(id, function(s){
        s.planningStructure.forEach(function(row, idx){ row.horaires = getVal('pS-'+idx+'-h'); row.activite = getVal('pS-'+idx+'-a'); });
        s.planningDojo.forEach(function(row, idx){ row.horaires = getVal('pD-'+idx+'-h'); row.module = getVal('pD-'+idx+'-a'); });
      }); return;
    }
    if(action==='edit-documents'){
      var s0 = findStagiaire(id);
      docEditBuffer = deepClone(s0.documents);
      if(!docEditBuffer.length) docEditBuffer.push({nom:'',lien:'',date:''});
      render(); return;
    }
    if(action==='add-doc-row'){
      syncDocBufferFromDom();
      docEditBuffer.push({nom:'',lien:'',date:''}); render(); return;
    }
    if(action==='remove-doc-row'){
      syncDocBufferFromDom();
      var idx2 = parseInt(el.getAttribute('data-idx'),10);
      docEditBuffer.splice(idx2,1); render(); return;
    }
    if(action==='cancel-documents'){
      docEditBuffer = null; render(); return;
    }
    if(action==='save-documents'){
      syncDocBufferFromDom();
      var cleaned = docEditBuffer.filter(function(d){ return d.nom || d.lien; });
      docEditBuffer = null;
      updateStagiaire(id, function(s){ s.documents = cleaned; });
      return;
    }
    if(action==='send-message'){
      var txt = getVal('msg-input').trim();
      if(!txt) return;
      var a = actorInfo();
      updateStagiaire(id, function(s){
        s.messages.push({ auteur:a.auteur, role:a.roleKey, date:new Date().toISOString(), texte:txt });
      });
      return;
    }
    if(action==='save-referent-contact'){
      var rcNom = getVal('rc-nom');
      var rcPrenom = getVal('rc-prenom');
      var rcEmail = getVal('rc-email');
      var rcTel = getVal('rc-telephone');
      var rcCompte = findReferentCompte();
      if(rcCompte){
        updateCompte(rcCompte.id, function(c){
          c.nom = rcNom; c.prenom = rcPrenom; c.email = rcEmail; c.telephone = rcTel;
          if(rcPrenom) c.nomAffiche = rcPrenom;
        });
      }
      showToast('Coordonnées mises à jour.');
      return;
    }
    if(action==='save-self-infos'){
      var selfEditableKeys = view.role==='stagiaire' ? STAGIAIRE_EDITABLE_FIELDS : (view.role==='tuteur' ? TUTEUR_EDITABLE_FIELDS : []);
      if(!selfEditableKeys.length) return;
      updateStagiaire(id, function(s){
        selfEditableKeys.forEach(function(k){ s[k] = getVal('self-'+k); });
      });
      showToast('Informations mises à jour.');
      return;
    }
  }
  function syncDocBufferFromDom(){
    if(!docEditBuffer) return;
    docEditBuffer.forEach(function(d, idx){
      var el = document.getElementById('doc-'+idx+'-nom');
      if(el){ d.nom = getVal('doc-'+idx+'-nom'); d.lien = getVal('doc-'+idx+'-lien'); d.date = getVal('doc-'+idx+'-date'); }
    });
  }

  document.addEventListener('click', onClick);
  document.addEventListener('keydown', function(e){
    if(e.key==='Enter'){
      var a = document.activeElement;
      if(a && (a.id==='login-identifiant' || a.id==='login-motdepasse')){ e.preventDefault(); doLogin(); }
    }
  });

  function init(){
    render();
    loadData().then(function(){ render(); });
  }
  init();
})();
</script>
</body>
</html>
